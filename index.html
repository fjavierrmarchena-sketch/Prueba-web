<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Me encantan los caballos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage" aria-label="Animación de un niño de dibujos sobre un pony">
    <svg viewBox="0 0 360 640" class="scene" role="img" aria-hidden="true">
      <!-- Cielo -->
      <rect width="360" height="640" fill="#8ccbf0"/>
      <!-- Edificio blanco -->
      <rect x="0" y="250" width="360" height="110" fill="#fbfbf7"/>
      <rect x="0" y="236" width="360" height="18" fill="#c8643b"/>
      <path d="M20 360 V300 a30 30 0 0 1 60 0 V360 Z" fill="#6b4a2b"/>
      <path d="M150 360 V300 a30 30 0 0 1 60 0 V360 Z" fill="#6b4a2b"/>
      <path d="M280 360 V300 a30 30 0 0 1 60 0 V360 Z" fill="#6b4a2b"/>
      <!-- Arena -->
      <rect x="0" y="360" width="360" height="280" fill="#e6c48f"/>
      <!-- Pony -->
      <g class="pony">
        <ellipse cx="170" cy="470" rx="100" ry="52" fill="#5a3a22"/>
        <ellipse cx="260" cy="420" rx="34" ry="30" fill="#5a3a22"/>
        <rect x="236" y="430" width="16" height="70" rx="6" fill="#4a2e1a"/>
        <rect x="270" y="430" width="16" height="70" rx="6" fill="#4a2e1a"/>
        <rect x="110" y="500" width="16" height="70" rx="6" fill="#4a2e1a"/>
        <rect x="140" y="500" width="16" height="70" rx="6" fill="#4a2e1a"/>
        <path d="M200 430 q-20 -10 -30 10 q-10 30 -20 60 q20 0 30 -10 q15 -30 20 -60Z" fill="#3a2414"/>
        <path d="M250 400 q-6 -16 6 -22 q10 2 10 14 Z" fill="#3a2414"/>
      </g>
      <!-- Niño -->
      <g class="kid">
        <circle cx="170" cy="330" r="34" fill="#f4c7a1"/>
        <path d="M136 322 q4 -30 34 -30 q30 0 34 30 q-10 -12 -34 -10 q-24 -2 -34 10Z" fill="#c9893f"/>
        <circle cx="158" cy="334" r="3" fill="#3a2414"/>
        <circle cx="182" cy="334" r="3" fill="#3a2414"/>
        <path d="M158 348 q12 10 24 0" stroke="#a04a3a" stroke-width="3" fill="none" stroke-linecap="round"/>
        <rect x="140" y="368" width="60" height="64" rx="14" fill="#9fc8ea"/>
        <rect x="128" y="380" width="16" height="48" rx="8" fill="#9fc8ea" class="arm"/>
        <rect x="196" y="380" width="16" height="48" rx="8" fill="#9fc8ea"/>
      </g>
      <!-- Globo de diálogo -->
      <g class="bubble">
        <path d="M70 180 h220 a18 18 0 0 1 18 18 v44 a18 18 0 0 1 -18 18 h-150 l-28 22 l6 -22 h-48 a18 18 0 0 1 -18 -18 v-44 a18 18 0 0 1 18 -18z" fill="#ffffff" stroke="#1a1a1a" stroke-width="4"/>
        <text x="180" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#1a1a1a">¡Me encantan</text>
        <text x="180" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#1a1a1a">los caballos!</text>
      </g>
    </svg>
  </main>
</body>
</html>
